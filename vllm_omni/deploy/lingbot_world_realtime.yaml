# LingBot-World v2 public realtime WebSocket deployment.
pipeline: lingbot_world_realtime
async_chunk: false
distributed_executor_backend: mp
dtype: bfloat16

stages:
  - stage_id: 0
    devices: "0,1"
    max_num_seqs: 1
    enforce_eager: true
    model_class_name: LingBotWorldCausalDMDPipeline
    engine_backend: vllm_omni.experimental.ar_diffusion.engine.ARDiffusionEngine
    model_config:
      ar_diffusion_height: 480
      ar_diffusion_width: 832
      ar_diffusion_streaming_vae: true
      ar_diffusion_kv_config:
        gpu_memory_fraction: 0.1
        warmup_cudagraph: false
    parallel_config:
      pipeline_parallel_size: 1
      data_parallel_size: 1
      tensor_parallel_size: 1
      sequence_parallel_size: 2
      ulysses_degree: 2
      ring_degree: 1
      allgather_degree: 1
      cfg_parallel_size: 1
      vae_patch_parallel_size: 2
      vae_parallel_mode: spatial_shard_height
      use_hsdp: false
      hsdp_shard_size: -1
      hsdp_replicate_size: 1
      enable_expert_parallel: false
    default_sampling_params:
      height: 480
      width: 832
      num_frames: 9
      num_inference_steps: 4
      max_sequence_length: 512
      seed: 42
      fps: 16
      output_type: pt
