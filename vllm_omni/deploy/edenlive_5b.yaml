# EdenLive 5B few-step: one reference-video rollout per request.
pipeline: edenlive
async_chunk: false
distributed_executor_backend: mp
dtype: bfloat16

stages:
  - stage_id: 0
    devices: "0"
    max_num_seqs: 1
    enforce_eager: true
    model_class_name: EdenLivePipeline
    engine_backend: vllm_omni.experimental.ar_diffusion.engine.ARDiffusionEngine
    diffusion_attention_config:
      default:
        backend: CUDNN_ATTN
    default_sampling_params:
      height: 704
      width: 1280
      num_frames: 117
      num_inference_steps: 4
      guidance_scale: 1.0
      fps: 24
    model_config:
      ar_diffusion_height: 704
      ar_diffusion_width: 1280
      ar_diffusion_kv_config:
        warmup_cudagraph: false
