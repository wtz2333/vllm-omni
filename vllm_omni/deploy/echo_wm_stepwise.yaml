# vllm serve <echo-wm-checkpoint> --omni \
#   --deploy-config vllm_omni/deploy/echo_wm_stepwise.yaml

pipeline: echo_wm
async_chunk: false
dtype: bfloat16

stages:
  - stage_id: 0
    devices: "0"
    model_class_name: EchoWMCausalPipeline
    max_num_seqs: 1
    enforce_eager: true
    diffusion_attention_config:
      default: TORCH_SDPA
    step_execution: true
    streaming_output: true
    default_sampling_params:
      num_inference_steps: 4
      num_frames: 241
      output_type: pil
    model_config:
      echo_wm_height: 704
      echo_wm_width: 1280
      # echo_wm_gemma_path: /path/to/gemma-3
